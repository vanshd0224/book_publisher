name: Build & Deploy Fullstack (Backend & Frontend)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend - Test, Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Run Backend Tests
        run: |
          cd backend
          npm run test

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure GCP Project
        run: gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      - name: Build Docker Container Image
        run: |
          IMAGE_URI="gcr.io/${{ secrets.GCP_PROJECT_ID }}/book-publisher-backend:${{ github.sha }}"
          cd backend
          docker build -t $IMAGE_URI .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Configure Docker for Google Container Registry (gcr.io)
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Push Container Image to gcr.io
        run: |
          docker push ${{ env.IMAGE_URI }}

      - name: Deploy Container to Cloud Run
        run: |
          gcloud run deploy book-publisher-backend \
            --image ${{ env.IMAGE_URI }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 1 \
            --max-instances 10 \
            --concurrency 80

  frontend:
    name: Frontend - Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Application
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE_URL: "https://book-publisher-backend-451315399249.asia-south1.run.app/api/v1"

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure GCP Project
        run: gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      - name: Build Frontend Docker Image with Live Backend API URL
        run: |
          FRONTEND_IMAGE_URI="gcr.io/${{ secrets.GCP_PROJECT_ID }}/book-publisher-frontend:${{ github.sha }}"
          cd frontend
          docker build --build-arg VITE_API_BASE_URL="https://book-publisher-backend-451315399249.asia-south1.run.app/api/v1" -t $FRONTEND_IMAGE_URI .
          echo "FRONTEND_IMAGE_URI=$FRONTEND_IMAGE_URI" >> $GITHUB_ENV

      - name: Configure Docker for gcr.io
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Push Frontend Image to gcr.io
        run: |
          docker push ${{ env.FRONTEND_IMAGE_URI }}

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy book-publisher-frontend \
            --image ${{ env.FRONTEND_IMAGE_URI }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --min-instances 1 \
            --max-instances 10 \
            --concurrency 80
